name: Build Companion installers

on:
  # Installer builds run on demand and on release tags only — not on every push.
  # (Per-commit installer builds were noisy and the cross-platform packaging is not
  # release-ready: it needs the tsc build + viewer-bundle steps and ffprobe sourcing.)
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install workspace deps
        run: npm ci

      # Stage 6: the canonical helper now targets net10.0-windows self-contained,
      # so both Companion and the standalone build it with the .NET 10 SDK.
      - name: Setup .NET 10
        if: runner.os == 'Windows'
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Build PowerPoint probe
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./companion/scripts/build-ppt-probe.ps1

      # ffprobe URLs can be overridden with repo/environment variables if you host vetted LGPL-only binaries.
      - name: Fetch ffprobe
        # Best-effort: the app degrades gracefully without ffprobe and the public LGPL
        # mirror URLs are flaky. Don't fail the installer build on a fetch miss.
        continue-on-error: true
        working-directory: companion
        env:
          FFPROBE_URL_MAC: ${{ vars.FFPROBE_URL_MAC }}
          FFPROBE_URL_WIN: ${{ vars.FFPROBE_URL_WIN }}
          FFPROBE_URL_LINUX: ${{ vars.FFPROBE_URL_LINUX }}
        run: npm run fetch-ffprobe

      - name: Build Companion viewer, shared packages, and application
        working-directory: companion
        run: |
          npm run build:viewer
          npm run build

      - name: Build installers
        working-directory: companion
        env:
          # Disable signing/notarization in CI unless explicitly configured.
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npx --no-install electron-builder --publish never

      - name: Verify clean-checkout application and viewer outputs
        working-directory: companion
        run: node -e "const fs=require('node:fs'); for (const file of ['dist/main.js','../frontend/dist-viewer/index.html','package.json']) { if (!fs.existsSync(file)) throw new Error('Missing clean-checkout build output: ' + file); }"

      - name: Verify packaged PowerPoint probe
        if: runner.os == 'Windows'
        shell: pwsh
        working-directory: companion
        run: |
          $canonicalPath = Join-Path $env:GITHUB_WORKSPACE 'packages/ppt-bridge/bin/win-x64/ppt-probe.exe'
          $compatibilityPath = Join-Path $env:GITHUB_WORKSPACE 'companion/bin/ppt-probe.exe'
          $packagedPath = Join-Path $PWD 'dist_out/win-unpacked/resources/bin/ppt-probe.exe'
          $paths = @($canonicalPath, $compatibilityPath, $packagedPath)
          foreach ($path in $paths) {
            if (-not (Test-Path -LiteralPath $path -PathType Leaf)) {
              throw "Expected PowerPoint probe artifact not found: $path"
            }
          }
          $canonicalHash = (Get-FileHash -LiteralPath $canonicalPath -Algorithm SHA256).Hash
          $compatibilityHash = (Get-FileHash -LiteralPath $compatibilityPath -Algorithm SHA256).Hash
          $packagedHash = (Get-FileHash -LiteralPath $packagedPath -Algorithm SHA256).Hash
          if ($canonicalHash -ne $compatibilityHash -or $compatibilityHash -ne $packagedHash) {
            throw "PowerPoint probe hashes differ across canonical, Companion, and packaged resources"
          }

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: companion-${{ matrix.os }}
          path: |
            companion/dist_out/*.dmg
            companion/dist_out/*.exe
            companion/dist_out/*.AppImage
            companion/dist_out/*.blockmap
            companion/dist_out/latest*.yml
